name: android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK on the Releases page

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

  apk:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      # A plain APK file, not a zip. Download link:
      # https://github.com/<owner>/<repo>/releases/download/latest/gym-log.apk
      - name: Publish APK on the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gym-log.apk
          gh release view latest > /dev/null 2>&1 || gh release create latest --prerelease \
            --title "Latest build" --notes "Newest debug APK. Built automatically on every push." --target "$GITHUB_SHA"
          gh release upload latest gym-log.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: gym-log-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
